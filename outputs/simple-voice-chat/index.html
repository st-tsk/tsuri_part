<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Voice Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="conversation" aria-label="会話">
        <header class="topbar">
          <div>
            <p class="eyebrow">Local Voice Chat</p>
            <h1>音声会話</h1>
          </div>
          <div class="status" id="status">待機中</div>
        </header>

        <div class="messages" id="messages" aria-live="polite">
          <article class="message assistant">
            <span>準備できています。下のマイクを押して話してください。</span>
          </article>
        </div>

        <form class="composer" id="composer">
          <button class="icon-button" id="micButton" type="button" aria-label="音声入力" title="音声入力">
            <span class="mic-icon"></span>
          </button>
          <input id="textInput" autocomplete="off" placeholder="文字でも入力できます" />
          <button class="send-button" type="submit">送信</button>
        </form>
      </section>
    </main>

    <script src="./app.js?v=2"></script>
  </body>
</html>
